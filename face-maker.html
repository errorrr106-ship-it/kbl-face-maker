<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBL 好き顔9選メーカー</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#fafafa;color:#111}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:26px;margin:15px 0 5px}.sub{text-align:center;color:#777;font-size:13px;margin-bottom:22px}.progress{height:7px;background:#e8e8e8;border-radius:9px;overflow:hidden;margin:10px 0 22px}.bar{height:100%;background:#111;width:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #ddd;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #0000000d;cursor:pointer}.photo{aspect-ratio:3/4;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;background-size:cover;background-position:center}.info{padding:12px;text-align:center}.name{font-weight:800}.actor{font-size:12px;color:#666;margin-top:3px}.work{font-size:11px;color:#999;margin-top:6px}.actions{display:flex;gap:8px;margin-top:14px}.actions button,.start button{flex:1;border:1px solid #ddd;background:#fff;padding:13px;border-radius:12px;font-weight:700}.start{text-align:center;background:white;border:1px solid #e5e5e5;border-radius:18px;padding:25px}.start button{background:#111;color:white;border:0;max-width:260px}.result{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{position:relative;aspect-ratio:1/1.2;background:#ddd;background-size:cover;background-position:center}.rank{position:absolute;top:6px;left:6px;background:#000;color:#fff;border-radius:99px;padding:3px 7px;font-size:11px}.caption{position:absolute;left:0;right:0;bottom:0;padding:20px 5px 6px;background:linear-gradient(transparent,#000b);color:#fff;font-size:11px;text-align:center;font-weight:700}.note{font-size:12px;color:#888;text-align:center;margin-top:18px}@media(max-width:480px){h1{font-size:22px}.wrap{padding:15px 10px}.info{padding:9px}.name{font-size:14px}}</style></head><body><div class="wrap"><h1>KBL 好き顔9選メーカー</h1><div class="sub">Korean BL Character Face Maker</div><section class="start" id="start"><b>好きな顔を直感で選んでください 😽</b><p style="color:#777;font-size:13px">主演キャラクターから、あなたの好き顔TOP9を作ります。</p><button onclick="begin()">START</button><div class="note">現在はサイト動作確認用のサンプルデータです。主演データ・写真を追加するとそのまま本番化できます。</div></section><section id="game" style="display:none"><div style="display:flex;justify-content:space-between;font-size:12px;color:#777"><span>どっちの顔が好き？</span><span id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="cards"><div class="card" id="a" onclick="pick(0)"></div><div class="card" id="b" onclick="pick(1)"></div></div><div class="actions"><button onclick="skip()">どっちも / 選べない</button><button onclick="unknown()">知らない</button></div></section><section class="result" id="result"><h2 style="text-align:center">MY KBL 好き顔9選</h2><div class="grid" id="grid"></div><div class="actions"><button onclick="location.reload()">もう一度</button></div></section></div><script>
// 本番ではここへ全作品の主演キャラクターを追加。image は作品ビジュアルの画像URL/ローカルパス。
const characters=[
 {work:'검사실의 제안',character:'주태선',actor:'김윤식',image:''},
 {work:'검사실의 제안',character:'이채하',actor:'박시우',image:''},
 {work:'하절기',character:'여은호',actor:'성인호',image:''},
 {work:'하절기',character:'차도현',actor:'김도민',image:''}
];
let scores=[],round=0,maxRounds=100,pair=[];
function begin(){if(characters.length<2)return;scores=characters.map(()=>1000);document.getElementById('start').style.display='none';document.getElementById('game').style.display='block';next()}
function choosePair(){let a=Math.floor(Math.random()*characters.length),b;do{b=Math.floor(Math.random()*characters.length)}while(b===a);return[a,b]}
function card(i){let c=characters[i];return `<div class="photo" ${c.image?`style="background-image:url('${c.image}')"`:''}>${c.image?'':'PHOTO'}</div><div class="info"><div class="name">${c.character}</div><div class="actor">${c.actor}</div><div class="work">${c.work}</div></div>`}
function next(){if(round>=maxRounds){finish();return}pair=choosePair();a.innerHTML=card(pair[0]);b.innerHTML=card(pair[1]);count.textContent=`${round+1} / ${maxRounds}`;bar.style.width=`${round/maxRounds*100}%`}
function elo(x,y,result){const ex=1/(1+10**((scores[y]-scores[x])/400));const ey=1-ex;const K=32;scores[x]+=K*(result-ex);scores[y]+=K*((1-result)-ey)}
function pick(side){elo(pair[side],pair[1-side],1);round++;next()}
function skip(){elo(pair[0],pair[1],.5);round++;next()}
function unknown(){round++;next()}
function finish(){game.style.display='none';result.style.display='block';let top=scores.map((s,i)=>({s,i})).sort((x,y)=>y.s-x.s).slice(0,9);grid.innerHTML=top.map((x,n)=>{let c=characters[x.i];return `<div class="tile" ${c.image?`style="background-image:url('${c.image}')"`:''}><span class="rank">${n+1}</span><div class="caption">${c.character}<br><small>${c.actor}</small></div></div>`}).join('')}
</script></body></html>
